<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Gestor de Usuarios</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
            rel="stylesheet">
        <link
            href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css"
            rel="stylesheet">
        <link
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
            rel="stylesheet">
        <link href="../public/css/estilos.css" rel="stylesheet">

    </head>
    <body>
        <!-- Barra superior -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid">
                <a class="navbar-brand"
                    href="../views/gestor_usuarios.html">Gestor de Usuarios</a>
                <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <button id="logout" class="btn btn-danger">Cerrar
                                Sesión</button>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="custom-breadcrumb">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item">
                        <a class="direcciones"
                            href="../views/home.html">Home</a>
                    </li>
                    <li class="breadcrumb-item active"
                        aria-current="page">Gestor de Usuarios</li>
                </ol>
            </nav>
        </div>

        <div class="container mt-5">
            <!-- Botón para agregar usuario -->
            <div class="mb-3">
                <!-- Botón para Agregar Usuario -->
                <a class="btn btn-success btn-icon-split" data-bs-toggle="modal"
                    data-bs-target="#addUserModal">
                    <span class="icon text-white-50"><i
                            class="fas fa-plus"></i></span>
                    <span class="text text-white">Agregar Usuario</span>
                </a>

                <!-- Botón para Activar/Desactivar Usuarios -->
                <a class="btn btn-warning btn-icon-split" id="toggle-status"
                    role="button">
                    <span class="icon"><i class="fas fa-minus"></i></span>
                    <span class="text">Habilitar/Deshabilitar Usuarios</span>
                </a>

            </div>
            <!-- Tabla de usuarios -->
            <table class="table table-striped table-bordered table-hover"
                id="userTable" role="grid" aria-describedby="dataTable_info">
                <thead class="table-dark">
                    <tr>
                        <th style="width: 5%; text-align: center;">
                            <input type="checkbox" id="selectAll">
                        </th>
                        <th>Nombre</th>
                        <th>Email</th>
                        <th>Rol</th>
                        <th style="text-align: center;">Editar</th>
                        <th style="text-align: center;">Habilitar/Deshabilitar
                            Usuario</th>

                    </tr>
                </thead>
                <tbody id="user-table-body">
                </tbody>
                <tfoot>
                    <tr>
                        <th></th>
                        <th class="text-center">Nombre</th>
                        <th class="text-center">Email</th>
                        <th class="text-center">Rol</th>
                        <th style="text-align: center;">Editar</th>
                        <th style="text-align: center;">Habilitar/Deshabilitar
                            Usuario</th>

                    </tr>
                </tfoot>
            </table>
        </div>

        <!-- Modal para agregar usuario -->
        <div class="modal fade" id="addUserModal" tabindex="-1"
            aria-labelledby="addUserModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="addUserModalLabel">Agregar
                            Usuario</h5>
                        <button type="button" class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="Cerrar"></button>
                    </div>
                    <form id="add-user-form">
                        <div class="modal-body">
                            <div class="mb-3">
                                <label for="nombre"
                                    class="form-label">Nombre</label>
                                <input type="text" class="form-control"
                                    id="nombre" name="nombre" required>
                            </div>
                            <div class="mb-3">
                                <label for="email"
                                    class="form-label">Email</label>
                                <input type="email" class="form-control"
                                    id="email" name="email" required>
                            </div>
                            <div class="mb-3">
                                <label for="password"
                                    class="form-label">Contraseña</label>
                                <input type="password" class="form-control"
                                    id="password" name="password" required>
                            </div>
                            <div class="mb-3">
                                <label for="rol" class="form-label">Rol</label>
                                <select class="form-select" id="rol" name="rol"
                                    required>
                                    <option value="admin">Admin</option>
                                    <option value="usuario">Usuario</option>
                                </select>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary"
                                data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit"
                                class="btn btn-primary">Guardar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Modal para editar usuario -->
        <div class="modal fade" id="editUserModal" tabindex="-1"
            aria-labelledby="editUserModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="editUserModalLabel">Editar
                            Usuario</h5>
                        <button type="button" class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="Cerrar"></button>
                    </div>
                    <form id="edit-user-form">
                        <div class="modal-body">
                            <input type="hidden" id="edit-id" name="id">
                            <div class="mb-3">
                                <label for="edit-nombre"
                                    class="form-label">Nombre</label>
                                <input type="text" class="form-control"
                                    id="edit-nombre" name="nombre" required>
                            </div>
                            <div class="mb-3">
                                <label for="edit-email"
                                    class="form-label">Email</label>
                                <input type="email" class="form-control"
                                    id="edit-email" name="email" required>
                            </div>
                            <div class="mb-3">
                                <label for="edit-password"
                                    class="form-label">Contraseña <small>(dejar
                                        en blanco para mantener la
                                        actual)</small></label>
                                <input type="password" class="form-control"
                                    id="edit-password" name="password">
                            </div>
                            <div class="mb-3">
                                <label for="edit-rol"
                                    class="form-label">Rol</label>
                                <select class="form-select" id="edit-rol"
                                    name="rol" required>
                                    <option value="admin">Admin</option>
                                    <option value="usuario">Usuario</option>
                                </select>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary"
                                data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit"
                                class="btn btn-primary">Guardar Cambios</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script
            src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
        <script src="../models/js/userModel.js"></script>

    </body>
</html>
