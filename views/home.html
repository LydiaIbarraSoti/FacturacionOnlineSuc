<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Panel Principal</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
        <link rel="stylesheet" href="../public/css/estilos.css">
    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Sistema Ejecutivo</a>
                <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <button id="logout" class="btn btn-danger">Cerrar
                                Sesión</button>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        <div class="container mt-5">
            <h1 class="text-center">Bienvenido al Sistema</h1>
            <p id="user-data" class="text-center text-muted"></p>
            <div class="row mt-4 justify-content-center">
                <div class="col-lg-4">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h5 class="card-title">Panel Administrativo</h5>
                            <p class="card-text">Accede a herramientas de
                                gestión de usuarios y configuraciones del
                                sistema.</p>
                            <a href="gestor_usuarios.html"
                                class="btn btn-primary">Ir al Panel</a>
                        </div>
                    </div>
                </div>
                <!-- Tarjetas adicionales -->
                <div class="col-lg-4">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h5 class="card-title">Facturas</h5>
                            <p class="card-text">Consulta y administra las
                                facturas de los clientes.</p>
                            <a href="facturas.html" class="btn btn-primary">Ir
                                modulo</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script src="../models/js/home.js"></script>
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
